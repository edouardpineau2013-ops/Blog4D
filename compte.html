<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestion du compte du blog des 4èmes D.">
    <title>Mon compte — Blog des 4D</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .account-container { max-width: 700px; margin: 60px auto; }
        .account-card { background: rgba(255,255,255,.85); padding: 35px; border-radius: 18px; box-shadow: 0 5px 20px rgba(0,0,0,.12); text-align: center; }
        .account-icon { font-size: 55px; margin-bottom: 15px; }
        .account-card h2 { margin-bottom: 10px; }
        .account-identifiant { font-size: 24px; font-weight: bold; color: #100b3a; margin: 20px 0 30px; overflow-wrap: anywhere; }
        .logout-button { border: none; padding: 13px 25px; border-radius: 9px; background: #100b3a; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .logout-button:hover { opacity: .9; }
    </style>
</head>
<body>
<header class="site-header"><div class="header-content"><div class="badge">BLOG DE CLASSE</div><h1><span>Mon compte</span></h1><p>Gérez votre compte et vos informations.</p></div></header>
<nav class="navbar" aria-label="Navigation principale"><div class="nav-container">
    <a href="index.html" class="nav-link">Accueil</a><a href="actualites.html" class="nav-link">Actualités</a><a href="evenements.html" class="nav-link">Événements</a><a href="cours.html" class="nav-link">Cours</a><a href="revision.html" class="nav-link">Révision</a><a href="contact.html" class="nav-link">Me contacter</a><a href="connexion.html" class="nav-link" id="account-link">Se connecter</a>
</div></nav>
<main>
    <div class="account-container">
        <section class="account-card">
            <div class="account-icon" aria-hidden="true"><img src="img/user.svg" class="emoji-svg" alt="" aria-hidden="true"></div>
            <h2>Bienvenue</h2>
            <p>Vous êtes connecté avec l'identifiant :</p>
            <div class="account-identifiant" id="identifiant-compte">Chargement...</div>
            <button class="logout-button" id="deconnexion-button" type="button">Se déconnecter</button>
        </section>
    </div>
</main>
<footer><p>© 2026 — Blog des 4èmes D</p></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="script.js" defer></script>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const identifiant = document.getElementById("identifiant-compte");
        const bouton = document.getElementById("deconnexion-button");

        try {
            const profil = await obtenirProfil();

            if (!profil) {
                window.location.replace("connexion.html");
                return;
            }

            identifiant.textContent = profil.identifiant || "Identifiant indisponible";
        } catch (error) {
            console.error("Erreur lors du chargement du compte :", error);
            window.location.replace("connexion.html");
        }

        bouton.addEventListener("click", async () => {
            bouton.disabled = true;
            bouton.textContent = "Déconnexion...";

            try {
                await deconnecter();
            } catch (error) {
                bouton.disabled = false;
                bouton.textContent = "Se déconnecter";
                alert("Impossible de vous déconnecter. Réessayez.");
            }
        });
    });
</script>
</body>
</html>
